<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpenTrade</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <header>
    <div>
      <h1>OpenTrade</h1>
      <p>Strategy editor, backtesting, and AI optimizer</p>
    </div>
    <div>
      <span id="modeBadge" class="badge">paper mode</span>
    </div>
  </header>

  <main class="layout">
    <aside class="panel sidebar">
      <h2>Strategies</h2>
      <div id="strategyList"></div>
      <div class="actions">
        <button id="newStrategyBtn" class="secondary">New Strategy</button>
      </div>
    </aside>

    <section class="panel">
      <div class="tabs">
        <button class="tab active" data-tab="settings">Settings</button>
        <button class="tab" data-tab="backtest">Backtest</button>
        <button class="tab" data-tab="optimizer">AI Optimizer</button>
      </div>

      <div id="settingsTab">
        <div class="grid-2">
          <div>
            <label>Name</label>
            <input id="strategyName" />
          </div>
          <div>
            <label>Mode</label>
            <select id="strategyMode">
              <option value="paper">Paper</option>
              <option value="live">Live (signal export scaffold)</option>
            </select>
          </div>
          <div>
            <label>Symbol</label>
            <input id="strategySymbol" value="EURUSD" />
          </div>
          <div>
            <label>Timeframe</label>
            <input id="strategyTimeframe" value="M1" />
          </div>
        </div>

        <h2 style="margin-top:1rem;">Risk & Execution</h2>
        <div class="grid-2" id="configFields"></div>

        <div class="actions">
          <button id="saveStrategyBtn">Save Strategy</button>
          <button id="runBacktestBtn" class="success">Run Backtest</button>
        </div>
      </div>

      <div id="backtestTab" class="hidden">
        <div class="status-line" id="backtestStatus">No backtest run yet.</div>
        <div class="metrics" id="metrics"></div>
        <canvas id="equityChart"></canvas>
        <h2 style="margin-top:1rem;">Recent Trades</h2>
        <table>
          <thead>
            <tr>
              <th>Side</th><th>Entry</th><th>Exit</th><th>PnL</th><th>Reason</th>
            </tr>
          </thead>
          <tbody id="tradesBody"></tbody>
        </table>
      </div>

      <div id="optimizerTab" class="hidden">
        <div class="status-line" id="optimizerStatus">
          Target gate: 65% win rate, 2-4 trades/day, positive forward return.
        </div>
        <div class="grid-2">
          <div>
            <label>Min Win Rate (%)</label>
            <input id="gateWinRate" type="number" value="65" />
          </div>
          <div>
            <label>Min Trades / Day</label>
            <input id="gateMinTpd" type="number" step="0.1" value="2" />
          </div>
          <div>
            <label>Max Trades / Day</label>
            <input id="gateMaxTpd" type="number" step="0.1" value="4" />
          </div>
          <div>
            <label>Max Drawdown (%)</label>
            <input id="gateMaxDd" type="number" step="0.1" value="10" />
          </div>
        </div>
        <div class="actions">
          <button id="startOptimizerBtn">Start Optimizer (runs until gate met)</button>
        </div>
        <div class="metrics" id="optimizerMetrics"></div>
      </div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
